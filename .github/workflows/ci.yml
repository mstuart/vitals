name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 24 is the primary target; 22 is the floor declared in package.json.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - name: Ultracite check
        run: npm run check

      # better-sqlite3 is a native addon. npm 11 defers install scripts, so the
      # prebuilt binary may not be fetched during `npm ci`.
      - run: npm rebuild better-sqlite3

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
